name: KC Streetcar Live Tracker

on:
  schedule:
    # GitHub doesn't reliably honor cron intervals under ~15 min on
    # lower-traffic repos -- a */5 schedule was observed landing 25-45+ min
    # apart in practice, not every 5 min. */15 is a granularity GitHub
    # tends to actually respect; see CLAUDE.md for the real-world numbers
    # this was measured against.
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  update-live-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch live streetcar positions
        env:
          TRANSITLAND_API_KEY: ${{ secrets.TRANSITLAND_API_KEY }}
        run: python kc_streetcar_realtime.py

      - name: Commit updated live data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/data/streetcar_live.json docs/data/streetcar_delays.json
          git diff --staged --quiet && echo "No new data" && exit 0
          git commit -m "Update streetcar live positions $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase origin main
          git push origin main
